<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#130d18">
  <meta name="description" content="A pixel-art hero lifestyle tracker. Improve Health, Stamina and Focus, finish missions, collect weapons, armor and companions.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lifestyle">
  <title>Lifestyle Hero / Player Progression</title>
  <style>
/* Theme tokens are deliberately independent from layout and tracking logic. */
:root {
  color-scheme: dark;
  font-family: "Trebuchet MS", -apple-system, BlinkMacSystemFont, sans-serif;
  font-synthesis: none;
  -webkit-tap-highlight-color: transparent;
  --bg: #080e12;
  --panel: #111a1e;
  --panel-raised: #182328;
  --line: #29383b;
  --text: #f4f7f1;
  --muted: #95a4a7;
  --accent: #c8fa64;
  --accent-dark: #86a943;
  --accent-glow: rgba(200, 250, 100, .18);
  --danger: #ef8278;
  --ring-off: #334348;
}

body[data-theme="sunset"] { --accent: #ff8e91; --accent-dark: #b95f76; --accent-glow: rgba(255,142,145,.18); --bg: #130d18; --panel: #221825; --panel-raised: #302031; --line: #483043; --ring-off: #54394d; }
body[data-theme="ice"] { --accent: #64e7f2; --accent-dark: #419da5; --accent-glow: rgba(100,231,242,.17); --bg: #07151d; --panel: #10242e; --panel-raised: #173340; --line: #2c4b56; --ring-off: #32535e; }
body[data-theme="mono"] { --accent: #f0f2e9; --accent-dark: #9ea49e; --accent-glow: rgba(240,242,233,.12); --bg: #0a0c0d; --panel: #191d1f; --panel-raised: #252b2e; --line: #3d4548; --ring-off: #435054; }

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); background: var(--bg); min-height: 100dvh; font-size: 16px; }
body::before { content:""; pointer-events:none; position:fixed; inset:0; z-index:0; opacity:.75; background: radial-gradient(ellipse at 12% 3%,var(--accent-glow),transparent 40%), radial-gradient(ellipse at 90% 70%,rgba(75,100,116,.11),transparent 52%); }
button,input,select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { touch-action: manipulation; }
.app-shell { position:relative; display:flex; flex-direction:column; min-height:100dvh; max-width:1100px; margin:auto; }
.topbar { z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:calc(env(safe-area-inset-top,0px) + 19px) 20px 18px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--bg) 92%,transparent); }
.brand { display:flex; align-items:center; gap:11px; min-width:0; }
.brand-emblem { width:45px; height:45px; flex-shrink:0; border:2px solid var(--accent); color:var(--accent); display:flex; justify-content:center; align-items:center; font-size:20px; font-weight:950; letter-spacing:-3px; transform:skew(-6deg); }
.emblem-dot { color:var(--text); }
.brand-text { display:flex; flex-direction:column; gap:2px; }
.brand-text strong { font-weight:900; letter-spacing:.075em; font-size:16px; }
.brand-text small { font-size:10px; letter-spacing:.15em; color:var(--muted); font-weight:700; }
.wallet-pill { display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:3px; padding:9px 12px; background:var(--panel); white-space:nowrap; font-weight:900; font-size:17px; font-variant-numeric:tabular-nums; }
.wallet-icon { color:var(--accent); font-size:19px; }
.screen { width:100%; flex:1; padding:26px 18px 130px; outline:none; }
.eyebrow { margin:0 0 9px; font-size:12px; font-weight:900; letter-spacing:.17em; color:var(--accent); text-transform:uppercase; }
.page-title { margin:0; font-size:clamp(33px,7.8vw,66px); line-height:.97; font-weight:950; letter-spacing:-.055em; text-transform:uppercase; }
.page-title,.banner-title,.brand-text strong,.big-value { font-family:Impact,"Arial Black","Trebuchet MS",sans-serif; font-stretch:condensed; letter-spacing:.01em; }
.page-title .outline { color:transparent; -webkit-text-stroke:1px var(--muted); }
.page-subtitle { margin:13px 0 0; color:var(--muted); line-height:1.55; max-width:640px; }
.section-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:29px 0 15px; }
.section-heading h2 { font-size:14px; letter-spacing:.12em; margin:0; font-weight:900; text-transform:uppercase; }
.section-heading .section-aside { font-size:12px; color:var(--muted); font-weight:700; text-align:right; }
.mission-banner { overflow:hidden; margin-top:24px; border:1px solid var(--line); background:linear-gradient(120deg,var(--panel-raised),var(--panel)); border-radius:7px; padding:20px; position:relative; }
.mission-banner::after { content:""; position:absolute; width:175px; height:175px; top:-100px; right:-55px; border:26px solid var(--accent-glow); border-radius:50%; }
.banner-label { font-size:11px; letter-spacing:.16em; color:var(--muted); font-weight:900; }
.banner-title { font-size:23px; font-weight:900; letter-spacing:-.035em; margin:8px 0 5px; }
.banner-copy { max-width:380px; color:var(--muted); line-height:1.45; font-size:14px; position:relative; z-index:1; }
.progress-track { height:5px; background:var(--line); margin-top:18px; border-radius:10px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); transition:width .25s ease; }
.stat-list { display:grid; gap:12px; }
.stat-card { display:grid; grid-template-columns:110px minmax(0,1fr); gap:15px; align-items:center; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:17px 16px; position:relative; overflow:hidden; }
.stat-card[data-stat="health"] { --stat-color:#f3a0bf; --stat-glow:rgba(243,160,191,.22); }
.stat-card[data-stat="stamina"] { --stat-color:#80d9cf; --stat-glow:rgba(128,217,207,.22); }
.stat-card[data-stat="focus"] { --stat-color:#a68af0; --stat-glow:rgba(166,138,240,.22); }
.stat-card::before { content:""; position:absolute; top:0; left:0; height:100%; width:3px; background:var(--stat-color); opacity:.85; }
.ring-wrap { position:relative; width:110px; aspect-ratio:1; display:grid; place-items:center; }
.ring { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 7px var(--stat-glow)); }
.ring circle.track { fill:none; stroke:var(--ring-off); stroke-width:8; }
.ring circle.segment { fill:none; stroke:var(--stat-color); stroke-width:8; stroke-linecap:round; }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
.glyph-disc { display:grid; place-items:center; width:66%; aspect-ratio:1; border-radius:50%; background:#33383b; }
.stat-glyph { width:72%; height:72%; fill:var(--stat-color); }
.stat-meta { min-width:0; }
.stat-label { font-weight:950; font-size:21px; letter-spacing:-.045em; text-transform:uppercase; }
.stat-hint { margin:5px 0 7px; color:var(--muted); font-size:12px; line-height:1.35; }
.stat-level { font-size:12px; font-weight:900; letter-spacing:.08em; color:var(--muted); margin:7px 0 3px; }
.stat-level strong { color:var(--text); font-size:15px; }
.quarter-count { font-size:12px; font-weight:900; letter-spacing:.07em; color:var(--stat-color); }
.stat-card .stat-actions .action-btn { background:var(--stat-color); }
.stat-actions { margin-top:12px; display:flex; align-items:center; gap:9px; }
.action-btn { border:0; background:var(--accent); color:#0b1213; border-radius:4px; font-size:13px; font-weight:950; padding:12px 15px; min-height:43px; line-height:1.1; transition:transform .13s,filter .13s; }
.action-btn:active { transform:scale(.98); }
.action-btn:hover:not(:disabled) { filter:brightness(1.07); }
.action-btn:disabled { background:var(--panel-raised); color:var(--muted); border:1px solid var(--line); }
.action-btn.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
.action-btn.ghost { color:var(--muted); background:transparent; border:1px solid var(--line); }
.action-btn.danger { background:var(--danger); color:#170d0d; }
.undo-link { background:none; border:none; color:var(--muted); text-decoration:underline; font-size:12px; padding:8px 0; }
.stat-completed { color:var(--accent); font-weight:900; font-size:12px; letter-spacing:.04em; }
.note-panel { border:1px dashed var(--line); background:rgba(255,255,255,.015); border-radius:6px; padding:16px; line-height:1.55; font-size:13px; color:var(--muted); }
.note-panel strong { color:var(--text); }
.activity-list { display:flex; flex-direction:column; gap:0; }
.activity-item { display:flex; align-items:center; gap:13px; padding:14px 0; border-bottom:1px solid var(--line); }
.activity-symbol { display:grid; place-items:center; width:34px; height:34px; flex:0 0 34px; border:1px solid var(--line); background:var(--panel); color:var(--accent); font-size:19px; border-radius:3px; }
.activity-detail { flex:1; min-width:0; }
.activity-detail strong { font-size:14px; }
.activity-detail small { display:block; color:var(--muted); margin-top:4px; font-size:12px; }
.activity-change { color:var(--accent); font-size:13px; font-weight:900; white-space:nowrap; }
.activity-change.negative { color:var(--danger); }
.headline-row { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; }
.big-value { color:var(--accent); font-size:clamp(34px,8vw,55px); font-weight:950; letter-spacing:-.055em; font-variant-numeric:tabular-nums; }
.money-card { background:linear-gradient(120deg,var(--panel-raised),var(--panel)); border:1px solid var(--line); padding:22px; border-radius:7px; margin:25px 0; }
.money-card .eyebrow { margin-bottom:6px; }
.money-meta { color:var(--muted); font-size:13px; margin-top:5px; }
.task-list, .reward-list { display:grid; gap:10px; }
.task-card, .reward-card { border:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:12px; padding:15px; border-radius:7px; min-height:78px; }
.task-checkbox { flex:0 0 34px; width:34px; height:34px; display:grid; place-items:center; border:2px solid var(--ring-off); border-radius:5px; color:var(--accent); font-size:19px; }
.task-card.complete .task-checkbox { border-color:var(--accent); background:var(--accent-glow); }
.task-title, .reward-title { font-weight:750; font-size:15px; line-height:1.3; overflow-wrap:anywhere; }
.task-card.complete .task-title { text-decoration:line-through; color:var(--muted); }
.task-description, .reward-description { color:var(--muted); font-size:12px; font-weight:700; margin-top:5px; }
.task-copy, .reward-copy { min-width:0; flex:1; }
.task-action { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.cash-gain { font-weight:900; color:var(--accent); font-size:14px; white-space:nowrap; }
.claim-button { border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:4px; padding:8px 10px; min-height:35px; font-size:12px; font-weight:900; white-space:nowrap; }
.claimed-label { font-size:12px; font-weight:800; color:var(--muted); }
.small-icon-button { border:0; color:var(--muted); background:transparent; font-size:19px; padding:5px; line-height:1; min-width:28px; }
.reward-emoji { width:45px; height:45px; flex:0 0 45px; background:var(--panel-raised); display:grid; place-items:center; border:1px solid var(--line); color:var(--accent); font-size:23px; border-radius:5px; }
.reward-card .action-btn { white-space:nowrap; padding:11px 12px; }
.empty-state { border:1px dashed var(--line); text-align:center; padding:38px 24px; color:var(--muted); border-radius:6px; line-height:1.5; }
.empty-state strong { display:block; font-size:18px; color:var(--text); margin-bottom:6px; }
.inline-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.settings-panel { border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:20px; margin-top:16px; }
.settings-panel h2 { font-size:16px; margin:0 0 5px; font-weight:900; }
.settings-panel p { color:var(--muted); line-height:1.55; margin:5px 0 17px; font-size:14px; }
.theme-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.theme-choice { background:var(--panel-raised); border:1px solid var(--line); padding:10px 5px; border-radius:5px; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:8px; font-size:11px; font-weight:800; }
.theme-choice.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.theme-swatch { width:34px; height:34px; border-radius:50%; border:4px solid #263038; background:#c8fa64; }
.theme-choice[data-value="sunset"] .theme-swatch { background:#ff8e91; border-color:#442938; }
.theme-choice[data-value="ice"] .theme-swatch { background:#64e7f2; border-color:#214450; }
.theme-choice[data-value="mono"] .theme-swatch { background:#f0f2e9; border-color:#3b4245; }
.settings-buttons { display:flex; gap:9px; flex-wrap:wrap; }
.settings-buttons .action-btn { flex:1; }
.fine-print { font-size:12px; color:var(--muted); line-height:1.5; }
.rule-list { margin:10px 0 0; padding-left:22px; color:var(--muted); font-size:13px; line-height:1.9; }
.rule-list strong { color:var(--text); }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; align-items:stretch; justify-content:center; height:calc(77px + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:color-mix(in srgb,var(--bg) 96%,transparent); border-top:1px solid var(--line); backdrop-filter:blur(18px); }
.nav-item { flex:1; max-width:200px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; border:0; color:var(--muted); background:transparent; font-size:10px; font-weight:900; letter-spacing:.09em; position:relative; }
.nav-item.active { color:var(--accent); }
.nav-item.active::before { content:""; position:absolute; top:0; left:28%; right:28%; height:3px; background:var(--accent); }
.nav-item svg { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; width:22px; height:22px; }
.editor-dialog { border:1px solid var(--line); background:var(--panel-raised); color:var(--text); width:min(92vw,450px); border-radius:9px; padding:25px; box-shadow:0 25px 100px rgba(0,0,0,.65); }
.editor-dialog::backdrop { background:rgba(1,6,8,.8); backdrop-filter:blur(6px); }
.editor-dialog h2 { margin:0 0 10px; font-size:22px; }
.editor-dialog p { margin:0 0 20px; color:var(--muted); font-size:14px; line-height:1.5; }
.field { margin:15px 0; }
.field label { display:block; font-size:13px; color:var(--muted); font-weight:800; margin-bottom:7px; }
.field input { display:block; width:100%; min-height:49px; border:1px solid var(--line); border-radius:4px; background:var(--bg); padding:12px 13px; color:var(--text); font-size:16px; }
.dialog-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:24px; }
.toast { display:none; position:fixed; bottom:calc(90px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 36px); background:var(--accent); color:#0a1413; border-radius:5px; z-index:10; padding:13px 17px; box-shadow:0 10px 30px rgba(0,0,0,.35); font-weight:900; font-size:13px; text-align:center; }
.toast.visible { display:block; }
.fuel-panel { border:1px solid var(--line); padding:16px; background:linear-gradient(110deg,#2a1a37,var(--panel)); border-radius:7px; }
.fuel-badges,.fuel-actions { display:flex; flex-wrap:wrap; gap:8px; }
.fuel-badges { min-height:34px; align-items:center; margin-bottom:12px; }
.fuel-badge { border:1px solid #80d9cf; background:#80d9cf25; color:#80d9cf; border-radius:20px; padding:8px 12px; font-size:11px; font-weight:900; letter-spacing:.05em; }
.fuel-badge.focus { border-color:#a68af0; background:#a68af025; color:#c3abff; }
.fuel-badge.health { border-color:#f3a0bf; background:#f3a0bf25; color:#f3a0bf; }
.fuel-idle { color:var(--muted); font-size:13px; }
.fuel-actions .action-btn { flex:1; font-size:11px; }
.fuel-disclaimer { color:var(--muted); font-size:11px; line-height:1.5; margin:11px 0 0; }
.home-hud { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:15px 0 10px; font-size:12px; font-weight:900; color:#f3b3ce; letter-spacing:.07em; }
.home-mode-tabs { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:5px 0 12px; }
.home-mode-btn { padding:14px 8px; border:1px solid var(--line); border-radius:6px; color:var(--muted); background:var(--panel-raised); font-size:12px; font-weight:900; }
.home-mode-btn.active { border-color:#f29cb8; color:#160e1b; background:linear-gradient(120deg,#f6a6be,#be91f4); }
.home-game-frame { width:min(100%,520px); margin:0 auto; border:7px solid #54334e; border-radius:9px; background:#372d4b; padding:5px; box-shadow:0 9px 0 #21182c,0 22px 40px #07070c80; }
#home-canvas { display:block; width:100%; height:auto; aspect-ratio:1; image-rendering:pixelated; cursor:crosshair; touch-action:manipulation; }
.home-controls { display:grid; grid-template-columns:160px 1fr; gap:12px; align-items:center; margin:24px auto 0; max-width:520px; }
.dpad { display:grid; grid-template-columns:repeat(3,47px); grid-template-rows:repeat(3,47px); gap:3px; }
.dpad button { background:linear-gradient(145deg,#494162,#302b49); border:1px solid #816a91; border-radius:6px; color:#fff2f9; font-size:18px; font-weight:900; box-shadow:0 3px 0 #1d172f; }
.dpad button:active { background:#cf88af; color:#271a33; transform:translateY(2px); }
.dpad-center { display:grid; place-items:center; color:#b885be; }
.home-interact-panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:14px; min-height:136px; }
.home-interact-panel strong { font-size:15px; }
.home-interact-panel p { color:var(--muted); font-size:12px; line-height:1.35; margin:6px 0 10px; }
.home-interact-panel .action-btn { width:100%; font-size:11px; padding:10px; }
.decorate-panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:16px; margin-top:22px; }
.decorate-panel p,.home-partitions p { color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 12px; }
.decor-toolbar,.inventory-strip,.home-palette>div { display:flex; flex-wrap:wrap; gap:7px; }
.decor-toolbar .action-btn { padding:10px; min-height:40px; font-size:11px; }
.selected-item { margin:15px 0; padding:9px; border:1px dashed var(--line); color:#e9aed0; font-size:11px; font-weight:900; }
.decorate-panel h3 { font-size:12px; letter-spacing:.09em; }
.inventory-chip,.palette-btn { background:var(--panel-raised); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:10px; font-size:12px; font-weight:800; }
.inventory-chip.active,.palette-btn.active { border-color:#f6a6be; background:#f6a6be2b; }
.inventory-strip>span { color:var(--muted); font-size:13px; }
.home-pet-note { padding:13px 0 2px; font-size:13px; line-height:1.45; color:#dfc4d8; }
.home-upgrade-line { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.home-upgrade-line span { border-top:4px solid var(--line); color:var(--muted); font-size:10px; text-align:center; padding-top:9px; font-weight:900; }
.home-upgrade-line span.unlocked { border-top-color:#e89db4; color:#f4c2d3; }
.home-palette,.home-partitions { border:1px solid var(--line); border-radius:6px; background:var(--panel); margin:14px 0; padding:16px; }
.home-palette strong,.home-partitions strong { display:block; font-size:13px; margin:0 0 9px; }
.home-palette>div { margin:0 0 14px; }
.home-partitions .action-btn { margin:5px 6px 5px 0; font-size:11px; }
.home-shop-list { display:grid; gap:9px; }
.home-shop-card { display:flex; align-items:center; gap:11px; border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:11px; min-width:0; }
.home-shop-card .action-btn { min-width:65px; font-size:11px; padding:10px 8px; }
.shop-pixel-icon { display:grid; place-items:center; background:var(--panel-raised); border:1px solid var(--line); border-radius:5px; flex:0 0 44px; height:44px; font-size:23px; }

  <script type="module">
// D&D 5e (2024) equipment-type names form the roster. All art, rarity names,
// virtual prices, and cosmetic progression are original Lifestyle Tracker systems.
const RARITIES={
  basic:{name:'Basic',prefix:'Worn',color:'#c5c7ce',glow:'#808a98',trim:'#8a6b53',order:0},
  rare:{name:'Rare',prefix:'Tideforged',color:'#9cdef2',glow:'#4e95c0',trim:'#437dba',order:1},
  epic:{name:'Epic',prefix:'Runebound',color:'#dabaff',glow:'#8353b6',trim:'#e4afff',order:2},
  legendary:{name:'Legendary',prefix:'Dawnfire',color:'#ffe0a3',glow:'#db8849',trim:'#d24e42',order:3},
};

// 38 weapons from the 2024 5e Equipment table, including the thrown Handaxe.
const WEAPON_TYPES=[
  ['club','Club','Simple Melee','club',180],
  ['dagger','Dagger','Simple Melee','dagger',200],
  ['greatclub','Greatclub','Simple Melee','club',280],
  ['handaxe','Handaxe','Simple Melee','axe',300],
  ['javelin','Javelin','Simple Melee','spear',260],
  ['light-hammer','Light Hammer','Simple Melee','hammer',280],
  ['mace','Mace','Simple Melee','mace',320],
  ['quarterstaff','Quarterstaff','Simple Melee','staff',230],
  ['sickle','Sickle','Simple Melee','sickle',230],
  ['spear','Spear','Simple Melee','spear',300],
  ['dart','Dart','Simple Ranged','dart',180],
  ['light-crossbow','Light Crossbow','Simple Ranged','crossbow',600],
  ['shortbow','Shortbow','Simple Ranged','bow',480],
  ['sling','Sling','Simple Ranged','sling',190],
  ['battleaxe','Battleaxe','Martial Melee','axe',450],
  ['flail','Flail','Martial Melee','flail',450],
  ['glaive','Glaive','Martial Melee','glaive',650],
  ['greataxe','Greataxe','Martial Melee','axe',720],
  ['greatsword','Greatsword','Martial Melee','greatsword',850],
  ['halberd','Halberd','Martial Melee','halberd',760],
  ['lance','Lance','Martial Melee','lance',680],
  ['longsword','Longsword','Martial Melee','longsword',580],
  ['maul','Maul','Martial Melee','hammer',700],
  ['morningstar','Morningstar','Martial Melee','mace',560],
  ['pike','Pike','Martial Melee','spear',620],
  ['rapier','Rapier','Martial Melee','rapier',550],
  ['scimitar','Scimitar','Martial Melee','scimitar',530],
  ['shortsword','Shortsword','Martial Melee','shortsword',440],
  ['trident','Trident','Martial Melee','trident',560],
  ['warhammer','Warhammer','Martial Melee','hammer',610],
  ['war-pick','War Pick','Martial Melee','pick',540],
  ['whip','Whip','Martial Melee','whip',330],
  ['blowgun','Blowgun','Martial Ranged','blowgun',260],
  ['hand-crossbow','Hand Crossbow','Martial Ranged','crossbow',780],
  ['heavy-crossbow','Heavy Crossbow','Martial Ranged','crossbow',1000],
  ['longbow','Longbow','Martial Ranged','bow',760],
  ['musket','Musket','Martial Ranged','musket',1200],
  ['pistol','Pistol','Martial Ranged','pistol',1100],
].map(([key,name,group,shape,baseCost])=>({key,name,group,shape,baseCost,type:'weapon'}));

// 12 armor suits plus shield, respecting D&D's distinct shield equipment slot.
const ARMOR_TYPES=[
  ['padded','Padded Armor','Light Armor','padded',220],
  ['leather','Leather Armor','Light Armor','leather',320],
  ['studded-leather','Studded Leather Armor','Light Armor','studded',540],
  ['hide','Hide Armor','Medium Armor','hide',460],
  ['chain-shirt','Chain Shirt','Medium Armor','chain',620],
  ['scale-mail','Scale Mail','Medium Armor','scale',760],
  ['breastplate','Breastplate','Medium Armor','breastplate',880],
  ['half-plate','Half Plate Armor','Medium Armor','halfplate',1060],
  ['ring-mail','Ring Mail','Heavy Armor','ring',650],
  ['chain-mail','Chain Mail','Heavy Armor','chain',940],
  ['splint','Splint Armor','Heavy Armor','splint',1240],
  ['plate','Plate Armor','Heavy Armor','plate',1500],
  ['shield','Shield','Shield','shield',460],
].map(([key,name,group,shape,baseCost])=>({key,name,group,shape,baseCost,type:group==='Shield'?'shield':'armor'}));

const RARITY_PRICE={basic:[0,1],rare:[1600,1.3],epic:[5200,2.2],legendary:[14500,4]};
function itemPrice(baseCost,rarity){
  const [base,multiplier]=RARITY_PRICE[rarity]||RARITY_PRICE.basic;
  return Math.round((base+baseCost*multiplier)/10)*10;
}

function variant(base,rarity){
  const r=RARITIES[rarity];
  return {id:`${rarity}-${base.key}`,name:`${r.prefix} ${base.name}`,baseName:base.name,
    type:base.type,group:base.group,rarity,shape:base.shape,cost:itemPrice(base.baseCost,rarity),
    tone:r.color,detail:r.glow,trim:r.trim,baseKey:base.key};
}

const COMPANIONS=[
  {id:'street-cat',name:'Street Cat',type:'companion',group:'Companion',rarity:'basic',cost:500,shape:'cat',tone:'#c99461',detail:'#eed0a2',trim:'#6c513f'},
  {id:'sparrow',name:'Sparrow',type:'companion',group:'Companion',rarity:'basic',cost:700,shape:'bird',tone:'#a88560',detail:'#ebce9c',trim:'#745944'},
  {id:'arctic-fox',name:'Arctic Fox',type:'companion',group:'Companion',rarity:'rare',cost:2300,shape:'fox',tone:'#f2f4f4',detail:'#c4e3eb',trim:'#619bbb'},
  {id:'ember-lynx',name:'Ember Lynx',type:'companion',group:'Companion',rarity:'rare',cost:3400,shape:'lynx',tone:'#e3a05b',detail:'#fbd89e',trim:'#b65c3b'},
  {id:'spirit-wolf',name:'Spirit Wolf',type:'companion',group:'Companion',rarity:'epic',cost:7000,shape:'wolf',tone:'#b9b1df',detail:'#e1d4fb',trim:'#7258a6'},
  {id:'moon-owl',name:'Moon Owl',type:'companion',group:'Companion',rarity:'epic',cost:8800,shape:'owl',tone:'#838dcb',detail:'#ebe7ff',trim:'#6257a3'},
  {id:'celestial-dragon',name:'Celestial Dragon',type:'companion',group:'Companion',rarity:'legendary',cost:18000,shape:'dragon',tone:'#e8b76d',detail:'#ffe9b5',trim:'#bf633e'},
  {id:'astral-griffin',name:'Astral Griffin',type:'companion',group:'Companion',rarity:'legendary',cost:24000,shape:'griffin',tone:'#dba65c',detail:'#fff0ca',trim:'#a85d3b'},
];

// Existing purchases from the previous Hero Edition remain usable and equipped.
const LEGACY_ITEMS=[
  ['worn-dagger','Worn Dagger','weapon','basic',200,'dagger','#afb7b9','#8a6a56'],
  ['training-sword','Training Sword','weapon','basic',450,'sword','#bec8ce','#685a4c'],
  ['tidal-saber','Tidal Saber','weapon','rare',1400,'saber','#64d1f6','#2b89be'],
  ['storm-lance','Storm Lance','weapon','rare',2400,'spear','#8fddec','#548fb8'],
  ['astral-greatsword','Astral Greatsword','weapon','epic',4900,'greatsword','#bd9eff','#8255d1'],
  ['phoenix-staff','Phoenix Staff','weapon','epic',6500,'staff','#ff9b8f','#e66964'],
  ['starfall-edge','Starfall Edge','weapon','legendary',12000,'starblade','#ffe7a0','#ea944a'],
  ['celestial-halberd','Celestial Halberd','weapon','legendary',18000,'halberd','#fff0ba','#f7b54b'],
  ['cloth-wraps','Cloth Wraps','armor','basic',180,'wraps','#d4b5a1','#957f7b'],
  ['leather-vest','Leather Vest','armor','basic',400,'leather','#855e50','#ca9d78'],
  ['warden-mail','Warden Mail','armor','rare',1600,'mail','#4f91b8','#a0e1eb'],
  ['nightguard-cloak','Nightguard Cloak','armor','rare',2700,'cloak','#3b6c9a','#8edff2'],
  ['runic-carapace','Runic Carapace','armor','epic',5100,'carapace','#693e96','#cf9cf6'],
  ['arcane-mantle','Arcane Mantle','armor','epic',7100,'mantle','#a16fc5','#e9b1ff'],
  ['solar-aegis','Solar Aegis','armor','legendary',14500,'aegis','#b98139','#ffe3a0'],
  ['void-regent','Void Regent','armor','legendary',21000,'regent','#303358','#f2be77'],
].map(([id,name,type,rarity,cost,shape,tone,detail])=>({id,name,type,rarity,cost,shape,tone,detail,trim:RARITIES[rarity].trim,legacy:true}));

const HERO_ITEMS=[...Object.keys(RARITIES).flatMap(rarity=>[...WEAPON_TYPES,...ARMOR_TYPES].map(base=>variant(base,rarity))),...COMPANIONS];
const HERO_INDEX=Object.fromEntries([...HERO_ITEMS,...LEGACY_ITEMS].map(item=>[item.id,item]));
const HERO_SLOTS=['weapon','armor','shield','companion'];

function initialHero(){return {owned:[],equipped:{weapon:null,armor:null,shield:null,companion:null}};}
function hydrateHero(input){
  const owned=Array.isArray(input?.owned)?[...new Set(input.owned.filter(id=>typeof id==='string'&&HERO_INDEX[id]))]:[];
  const equipped=Object.fromEntries(HERO_SLOTS.map(type=>{
    const id=input?.equipped?.[type];
    return [type,owned.includes(id)&&HERO_INDEX[id]?.type===type?id:null];
  }));
  return {owned,equipped};
}
function buyHeroItem(state,id){
  const item=HERO_INDEX[id];
  if(!item||item.legacy||state.hero.owned.includes(id)||state.wallet<item.cost)return false;
  state.wallet-=item.cost;state.hero.owned.push(id);state.hero.equipped[item.type]=id;return true;
}
function toggleHeroEquip(hero,id){
  const item=HERO_INDEX[id];if(!item||!hero.owned.includes(id))return false;
  hero.equipped[item.type]=hero.equipped[item.type]===id?null:id;return true;
}
function unequipHeroSlot(hero,slot){
  if(!HERO_SLOTS.includes(slot)||!hero.equipped[slot])return false;
  hero.equipped[slot]=null;return true;
}
function visualPower(level){return Math.min(1,Math.max(0,(Math.max(1,Number(level)||1)-1)/11));}

// Lifestyle Tracker's rules live here, independent of its appearance.
// A quarter is one step, regardless of the current level.

const STATS = {
  health: { name: 'Health', short: 'HEALTH', action: 'Workout', hint: 'Strength or general workout', symbol: '✚' },
  stamina: { name: 'Stamina', short: 'STAMINA', action: 'Cardio session', hint: 'Cardio or endurance training', symbol: '↗' },
  focus: { name: 'Focus', short: 'FOCUS', action: 'Focus session', hint: 'Distraction-free work or practice', symbol: '◎' },
};

function dateKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function shiftDate(key, days) {
  const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || '');
  if (!parts) return null;
  const shifted = new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]) + days, 12);
  return dateKey(shifted);
}

function advanceStat(stat, amount) {
  let level = Math.max(1, Math.floor(Number(stat.level) || 1));
  let quarters = Math.max(0, Math.min(3, Math.floor(Number(stat.quarters) || 0)));
  if (amount > 0) {
    quarters += 1;
    if (quarters === 4) { level += 1; quarters = 0; }
  } else if (amount < 0) {
    if (quarters > 0) quarters -= 1;
    else if (level > 1) { level -= 1; quarters = 3; }
  }
  return { level, quarters };
}

function initialState(today = dateKey()) {
  return {
    version: 3,
    createdAt: today,
    lastSettledDate: shiftDate(today, -1),
    stats: {
      health: { level: 1, quarters: 0 },
      stamina: { level: 1, quarters: 0 },
      focus: { level: 1, quarters: 0 },
    },
    dayLog: {},
    tasks: [

      { id: 'daily-outside', title: 'Go outside for an hour', cash: 100, completedDates: [] },

    ],

    theme: 'sunset',

  };
}

function safeText(value, max = 80) {
  return typeof value === 'string' ? value.trim().slice(0, max) : '';
}

function hydrate(input, today = dateKey()) {
  const defaults = initialState(today);
  if (!input || typeof input !== 'object' || Array.isArray(input)) return defaults;
  const state = { ...defaults };
  const validDate = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && shiftDate(value, 0) === value;
  state.createdAt = validDate(input.createdAt) ? input.createdAt : today;
  state.lastSettledDate = validDate(input.lastSettledDate) ? input.lastSettledDate : shiftDate(today, -1);
  // Prevent a backup with a future settlement date from stopping normal daily checks.
  if (state.lastSettledDate >= today) state.lastSettledDate = shiftDate(today, -1);
  for (const key of Object.keys(STATS)) {
    const source = input.stats?.[key] || {};
    state.stats[key] = {
      level: Math.max(1, Math.min(999, Math.floor(Number(source.level) || 1))),
      quarters: Math.max(0, Math.min(3, Math.floor(Number(source.quarters) || 0))),
    };
  }
  state.dayLog = {};
  if (input.dayLog && typeof input.dayLog === 'object') {
    for (const [day, entry] of Object.entries(input.dayLog)) {
      if (validDate(day) && entry && typeof entry === 'object') {
        state.dayLog[day] = Object.fromEntries(Object.keys(STATS).map(k => [k, entry[k] === true]));
      }
    }
  }
  const cleanTasks = (Array.isArray(input.tasks) ? input.tasks : defaults.tasks).slice(0, 150).map((item, i) => ({
    id: safeText(item?.id, 100) || `task-restored-${i}`,
    title: safeText(item?.title) || 'Untitled task',
    cash: Math.max(1, Math.min(10000, Math.floor(Number(item?.cash) || 25))),
    completedDates: (Array.isArray(item?.completedDates) ? item.completedDates : []).filter(validDate).slice(-400),
  }));
  const cleanRewards = (Array.isArray(input.rewards) ? input.rewards : defaults.rewards).slice(0, 150).map((item, i) => ({
    id: safeText(item?.id, 100) || `reward-restored-${i}`,
    title: safeText(item?.title) || 'Untitled reward',
    cost: Math.max(1, Math.min(1000000, Math.floor(Number(item?.cost) || 100))),
  }));
  state.tasks = cleanTasks;
  if (input.version === 1) {
    const oldDefaults = { 'task-1':'Make my bed', 'task-2':'Read or study', 'task-3':'Tidy my space' };
    const untouched = cleanTasks.filter(t => oldDefaults[t.id] === t.title);
    if (untouched.length) {
      state.tasks = [...defaults.tasks, ...cleanTasks.filter(t => !untouched.includes(t))].slice(0, 150);
    }
  }
  state.rewards = cleanRewards;
  state.wallet = Math.max(0, Math.min(100000000, Math.floor(Number(input.wallet) || 0)));
  state.transactions = Array.isArray(input.transactions) ? input.transactions.slice(0, 200).filter(x => x && typeof x === 'object').map(x => ({
    id: safeText(x.id, 100), title: safeText(x.title), amount: Math.max(-1000000, Math.min(1000000, Math.floor(Number(x.amount) || 0))), day: validDate(x.day) ? x.day : today,
  })) : [];
  state.activity = Array.isArray(input.activity) ? input.activity.slice(0, 250).filter(x => x && typeof x === 'object' && STATS[x.stat]).map(x => ({
    stat: x.stat, day: validDate(x.day) ? x.day : today, change: Math.max(-1, Math.min(1, Number(x.change) || 0)), reason: safeText(x.reason, 30), level: Math.max(1, Math.floor(Number(x.level) || 1)), quarters: Math.max(0, Math.min(3, Math.floor(Number(x.quarters) || 0))),
  })) : [];
  state.theme = ['acid', 'sunset', 'ice', 'mono'].includes(input.theme) ? input.theme : 'sunset';
  state.hero=hydrateHero(input.hero);
  return state;
}

function logExercise(state, statKey, today = dateKey()) {
  if (!STATS[statKey]) return false;
  const record = (state.dayLog[today] ||= {});
  if (record[statKey]) return false;
  const next = advanceStat(state.stats[statKey], 1);
  state.stats[statKey] = next;
  record[statKey] = true;
  state.activity.unshift({ stat: statKey, day: today, change: 1, reason: 'completed', ...next });
  state.activity.length = Math.min(250, state.activity.length);
  return true;
}

function undoExercise(state, statKey, today = dateKey()) {
  if (!STATS[statKey] || !state.dayLog[today]?.[statKey]) return false;
  const next = advanceStat(state.stats[statKey], -1);
  state.stats[statKey] = next;
  state.dayLog[today][statKey] = false;
  state.activity.unshift({ stat: statKey, day: today, change: -1, reason: 'correction', ...next });
  state.activity.length = Math.min(250, state.activity.length);
  return true;
}

function settleMissedDays(state, today = dateKey()) {
  let cursor = shiftDate(state.lastSettledDate, 1);
  if (!cursor) { state.lastSettledDate = shiftDate(today, -1); return 0; }
  let missed = 0;
  let iterations = 0;
  // Applies every unprocessed calendar day, including when the app was closed.
  while (cursor < today && iterations < 10000) {
    for (const key of Object.keys(STATS)) {
      if (state.dayLog[cursor]?.[key] !== true) {
        const next = advanceStat(state.stats[key], -1);
        state.stats[key] = next;
        state.activity.unshift({ stat: key, day: cursor, change: -1, reason: 'missed', ...next });
        missed++;
      }
    }
    state.lastSettledDate = cursor;
    cursor = shiftDate(cursor, 1);
    iterations++;
  }
  state.activity.length = Math.min(250, state.activity.length);
  // Old individual completion records can be discarded after they are settled.
  for (const day of Object.keys(state.dayLog)) {
    if (day < shiftDate(today, -180)) delete state.dayLog[day];
  }
  return missed;
}

  }else if(item.type==='shield'){
    drawShield(c,item,44,37,.8);
  }else{
    c.save();c.translate(10,['dragon','griffin'].includes(item.shape)?30:12);c.scale(1,1);
    drawPet(c,item,0,2,1);c.restore();
  }
  if(item.rarity==='legendary'){
    paint(c,9,9,5,5,'#ffecae');paint(c,74,71,4,4,'#ffe4ad');
  }
}


// Separate storage lets the hero experiment coexist with the original home version.
const STORAGE_KEY='lifestyle-tracker:hero:v1';
const LEGACY_KEY='lifestyle-tracker:v1';
const screen=document.getElementById('screen');
const walletTop=document.getElementById('wallet-top');
const dialog=document.getElementById('editor-dialog');
const toastElement=document.getElementById('toast');
const importFile=document.getElementById('import-file');
const tabs=['status','missions','hero','shop','settings'];
let activeTab='status';
let storeFilter='weapon';
let storeRarity='basic';
let storeQuery='';
let activeDate=dateKey();
let toastTimer;
let state=loadState();

function loadState(){
  try{
    const current=localStorage.getItem(STORAGE_KEY);
    if(current)return hydrate(JSON.parse(current),dateKey());
    const earlier=localStorage.getItem(LEGACY_KEY);
    if(earlier)return hydrate(JSON.parse(earlier),dateKey());
    return initialState(dateKey());
  }catch{
    alert('Could not read saved progress. A new profile was started; you can restore a backup in Settings.');
    return initialState(dateKey());
  }
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{showToast('Could not save. Export a backup.');}}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);}
function amount(n){return Math.floor(n).toLocaleString('en-US');}
function completed(stat){return state.dayLog[activeDate]?.[stat]===true;}
function formatDate(key){const [y,m,d]=key.split('-').map(Number);return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'}).format(new Date(y,m-1,d,12));}
function uniqueId(prefix){return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;}
function showToast(message){toastElement.textContent=message;toastElement.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastElement.classList.remove('visible'),3000);}

function syncDay(){
  const now=dateKey();if(now!==activeDate)activeDate=now;
  const missed=settleMissedDays(state,now);
  if(missed){save();showToast('Daily stat update applied');}
}

function render(){
  document.body.dataset.theme=state.theme;
  walletTop.textContent=amount(state.wallet);
  const views={status:renderStatus,missions:renderMissions,hero:renderHero,shop:renderShop,settings:renderSettings};
  screen.innerHTML=views[activeTab]();
  if(activeTab==='hero'||activeTab==='status')drawHero(document.getElementById('hero-canvas'),state.stats,state.hero.equipped);
  if(activeTab==='shop'||activeTab==='hero'){
    document.querySelectorAll('canvas[data-item]').forEach(canvas=>drawItemIcon(canvas,HERO_INDEX[canvas.dataset.item]));
  }
  document.querySelectorAll('[data-tab]').forEach(button=>{
    const active=button.dataset.tab===activeTab;
    button.classList.toggle('active',active);
    if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
  });
}

function statGlyph(key){
  const shape={
    health:'<path d="M50 78 20 48C6 34 13 14 31 14c9 0 15 5 19 11 4-6 10-11 19-11 18 0 25 20 11 34L50 78Z"/>',
    stamina:'<path d="M55 12 23 54h26l-5 34 34-46H53l2-30Z"/>',
    focus:'<path d="M7 50C20 32 35 24 50 24s30 8 43 26C80 68 65 76 50 76S20 68 7 50Zm43-17a17 17 0 1 0 0 34 17 17 0 0 0 0-34Z" fill-rule="evenodd"/>',
  }[key];
  return `<svg class="stat-glyph" viewBox="0 0 100 100" aria-hidden="true">${shape}</svg>`;
}
function ringMarkup(stat,key){
  const path=Array.from({length:4},(_,i)=>{
    const transform=`rotate(${-90+i*90} 50 50)`;
    return `<circle class="track" cx="50" cy="50" r="42" stroke-dasharray="56 264" transform="${transform}"/>${i<stat.quarters?`<circle class="segment" cx="50" cy="50" r="42" stroke-dasharray="56 264" transform="${transform}"/>`:''}`;
  }).join('');
  return `<div class="ring-wrap" role="img" aria-label="${key} level ${stat.level}, ${stat.quarters} out of 4"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true">${path}</svg><div class="ring-center"><span class="glyph-disc">${statGlyph(key)}</span></div></div>`;
}
function statusCard(key){
  const stat=state.stats[key],done=completed(key),def=STATS[key];
  return `<article class="stat-card" data-stat="${key}">${ringMarkup(stat,key)}<div class="stat-meta"><div class="stat-label">${def.name}</div><div class="stat-level">LEVEL <strong>${stat.level}</strong></div><div class="quarter-count">${stat.quarters} / 4</div><div class="stat-actions">${done?`<span class="stat-completed">✓ DONE</span><button class="undo-link" data-action="undo-stat" data-id="${key}">UNDO</button>`:`<button class="action-btn" data-action="log-stat" data-id="${key}">+ ${def.action.toUpperCase()}</button>`}</div></div></article>`;
}
function heroStage(compact=false){
  const eq=state.hero.equipped;
  const pet=HERO_INDEX[eq.companion];
  return `<section class="hero-stage ${compact?'compact':''}"><div class="hero-canvas-frame"><div class="stage-upper"><span>CHARACTER // 001</span><span class="stage-live">● ACTIVE</span></div><canvas id="hero-canvas" width="240" height="320" aria-label="Human-proportioned pixel art hero with dark center-parted hair and glasses. Health affects muscle definition, Stamina affects energy, and Focus affects magical effects. Equipment appears on his body."></canvas><div class="stage-bottom"><span>${eq.weapon?escapeHtml(HERO_INDEX[eq.weapon].name):'UNARMED'}</span><span>${pet?escapeHtml(pet.name):'SOLO'}</span></div></div>
  <div class="stage-attributes"><span>♥ ${state.stats.health.level}</span><span>ϟ ${state.stats.stamina.level}</span><span>◉ ${state.stats.focus.level}</span></div></section>`;
}
function renderActivity(){
  if(!state.activity.length)return '';
  return `<div class="section-heading"><h2>ACTIVITY</h2></div><div class="activity-list">${state.activity.slice(0,4).map(item=>`<div class="activity-item"><span class="activity-symbol">${STATS[item.stat]?.symbol||'+'}</span><div class="activity-detail"><strong>${STATS[item.stat]?.name||''}</strong><small>${formatDate(item.day)}</small></div><span class="activity-change ${item.change<0?'negative':''}">${item.change>0?'+¼':'−¼'}</span></div>`).join('')}</div>`;
}
function renderStatus(){
  return `<p class="eyebrow">PLAYER PROFILE</p>${heroStage(true)}<div class="section-heading"><h2>CORE ATTRIBUTES</h2></div><section class="stat-list" aria-label="Stats">${Object.keys(STATS).map(statusCard).join('')}</section>${renderActivity()}`;
}
function renderMissions(){
  const claimed=state.tasks.filter(t=>t.completedDates.includes(activeDate)).length;
  return `<p class="eyebrow">DAILY OPERATIONS</p><h1 class="page-title">MISSIONS.</h1><div class="money-card"><div class="eyebrow">TODAY</div><div class="big-value">${claimed} / ${state.tasks.length}</div><div class="money-meta">AVAILABLE ${amount(state.tasks.reduce((sum,t)=>sum+t.cash,0))}</div></div><div class="section-heading"><h2>TASKS</h2><button class="action-btn" data-modal="task">+ ADD</button></div><section class="task-list">${state.tasks.length?state.tasks.map(t=>{
    const done=t.completedDates.includes(activeDate);
    return `<article class="task-card ${done?'complete':''}"><div class="task-checkbox" aria-hidden="true">${done?'✓':''}</div><div class="task-copy"><div class="task-title">${escapeHtml(t.title)}</div></div><div class="task-action"><span class="cash-gain">+${amount(t.cash)}</span>${done?'<span class="claimed-label">✓ PAID</span>':`<button class="claim-button" data-action="claim-task" data-id="${escapeHtml(t.id)}">CLAIM</button>`}<button class="small-icon-button" data-action="remove-task" data-id="${escapeHtml(t.id)}" aria-label="Remove ${escapeHtml(t.title)}">×</button></div></article>`;
  }).join(''):'<div class="empty-state">NO MISSIONS</div>'}</section>`;
}
function slotCard(type){
  const id=state.hero.equipped[type],item=HERO_INDEX[id];
  return `<div class="equip-slot"><div class="slot-label">${type.toUpperCase()}</div><div class="slot-content">${item?`<canvas data-item="${id}" width="88" height="88" aria-hidden="true"></canvas>`:'<span class="empty-slot-icon">◇</span>'}<div class="slot-text"><strong>${item?escapeHtml(item.name):'NONE'}</strong>${item?`<small class="rarity-text ${item.rarity}">${RARITIES[item.rarity].name}</small>`:''}</div></div>${item?`<button class="action-btn secondary" data-action="unequip" data-id="${type}">UNEQUIP</button>`:''}</div>`;
}
function inventoryCard(id){
  const item=HERO_INDEX[id],equipped=state.hero.equipped[item.type]===id;
  return `<button class="inventory-card ${equipped?'equipped':''}" data-action="toggle-equip" data-id="${id}"><canvas data-item="${id}" width="88" height="88" aria-hidden="true"></canvas><span><strong>${escapeHtml(item.name)}</strong><small class="rarity-text ${item.rarity}">${RARITIES[item.rarity].name} · ${item.type}</small></span><em>${equipped?'EQUIPPED':'EQUIP'}</em></button>`;
}
function renderHero(){
  return `<p class="eyebrow">CHARACTER // EQUIPMENT</p><h1 class="page-title">HERO.</h1>${heroStage()}<div class="section-heading"><h2>EQUIPPED</h2></div><div class="equip-grid">${HERO_SLOTS.map(slotCard).join('')}</div><div class="section-heading"><h2>INVENTORY</h2><span class="section-aside">${state.hero.owned.length} ITEMS</span></div><div class="hero-inventory">${state.hero.owned.length?state.hero.owned.map(inventoryCard).join(''):'<div class="empty-state">EMPTY INVENTORY</div>'}</div>`;
}
function catalogCard(item){
  const owned=state.hero.owned.includes(item.id),equipped=state.hero.equipped[item.type]===item.id;
  const disabled=!owned&&state.wallet<item.cost;
  const label=item.baseKey==='handaxe'?'Handaxe · Thrown':item.group;
  return `<article class="catalog-card rarity-${item.rarity}"><div class="catalog-art"><canvas data-item="${item.id}" width="88" height="88" aria-label="Pixel-art ${escapeHtml(item.baseName||item.shape)}"></canvas></div><div class="catalog-info"><div class="catalog-name">${escapeHtml(item.name)}</div><span class="catalog-type">${escapeHtml(label)}</span><span class="rarity-text ${item.rarity}">${RARITIES[item.rarity].name.toUpperCase()}</span><div class="catalog-price">${amount(item.cost)}</div></div><button class="action-btn catalog-button ${owned?'secondary':''}" data-action="${owned?'toggle-equip':'buy-hero'}" data-id="${item.id}" ${disabled?'disabled':''}>${owned?(equipped?'UNEQUIP':'EQUIP'):'BUY'}</button></article>`;
}
function catalogResults(){
  const results=HERO_ITEMS.filter(item=>item.type===storeFilter&&item.rarity===storeRarity&&
    `${item.name} ${item.group} ${item.baseName||''} ${item.baseKey==='handaxe'?'throwing axe':''}`.toLowerCase().includes(storeQuery.trim().toLowerCase()));
  if(!results.length)return '<div class="empty-state">NO MATCHING GEAR</div>';
  const groups=[...new Set(results.map(item=>item.group))];
  return groups.map(group=>`<div class="rarity-heading ${storeRarity}"><span>${escapeHtml(group.toUpperCase())}</span><span>${results.filter(item=>item.group===group).length} ITEMS</span></div><section class="catalog-list">${results.filter(item=>item.group===group).map(catalogCard).join('')}</section>`).join('');
}
function renderShop(){
  const filters=[['weapon','WEAPONS'],['armor','ARMOR'],['shield','SHIELDS'],['companion','PETS']];
  return `<p class="eyebrow">HERO ARSENAL</p><h1 class="page-title">STORE.</h1><div class="store-balance"><span>YOUR FUNDS</span><strong>${amount(state.wallet)}</strong></div><div class="store-tabs">${filters.map(([key,label])=>`<button class="store-tab ${storeFilter===key?'active':''}" data-action="store-filter" data-value="${key}" aria-pressed="${storeFilter===key}">${label}</button>`).join('')}</div>
  <div class="rarity-tabs">${Object.keys(RARITIES).map(rarity=>`<button class="rarity-tab ${rarity} ${storeRarity===rarity?'selected':''}" data-action="store-rarity" data-value="${rarity}" aria-pressed="${storeRarity===rarity}">${RARITIES[rarity].name.toUpperCase()}</button>`).join('')}</div>
  <input id="store-search" class="store-search" type="search" placeholder="SEARCH EQUIPMENT" aria-label="Search equipment" value="${escapeHtml(storeQuery)}" maxlength="50" autocomplete="off">
  <div id="catalog-results">${catalogResults()}</div>`;
}
function renderSettings(){
  const themes=[['acid','NEON'],['sunset','VICE'],['ice','ICE'],['mono','MONO']];
  return `<p class="eyebrow">SYSTEM CONTROL</p><h1 class="page-title">SETTINGS.</h1>
    <section class="settings-panel"><h2>COLORS</h2><div class="theme-grid">${themes.map(([id,name])=>`<button class="theme-choice ${state.theme===id?'active':''}" data-action="set-theme" data-value="${id}" aria-pressed="${state.theme===id}"><span class="theme-swatch"></span><span>${name}</span></button>`).join('')}</div></section>
    <section class="settings-panel"><h2>BACKUPS</h2><div class="settings-buttons"><button class="action-btn" data-action="export">EXPORT</button><button class="action-btn secondary" data-action="import">IMPORT</button></div><p class="fine-print">Progress stays in your browser. Export before clearing Safari data or switching devices.</p></section>
    <section class="settings-panel"><h2>RESET</h2><button class="action-btn danger" data-action="reset">RESET HERO DATA</button></section>
    <p class="fine-print">HERO VERSION 2.0 · Original pixel art · D&D equipment types · Unofficial fan project.</p>`;
}

function openEditor(){
  dialog.innerHTML=`<form id="editor-form"><h2 id="dialog-title">NEW MISSION</h2><div class="field"><label for="item-name">TASK</label><input id="item-name" name="title" maxlength="80" required></div><div class="field"><label for="item-value">PAYOUT ($)</label><input id="item-value" name="value" type="number" inputmode="numeric" min="1" max="10000" value="50" required></div><div class="dialog-actions"><button type="button" class="action-btn secondary" data-action="close-modal">CANCEL</button><button type="submit" class="action-btn">SAVE</button></div></form>`;
  dialog.showModal();
}
function changeStat(key,undo=false){
  if(!STATS[key])return;
  if(undo&&!confirm('Undo today’s exercise?'))return;
  const before=state.stats[key].level;
  const changed=undo?undoExercise(state,key,activeDate):logExercise(state,key,activeDate);
  if(!changed)return;
  save();render();
  showToast(undo?'CORRECTED':state.stats[key].level>before?`${STATS[key].name.toUpperCase()} LEVEL UP!`:'+¼');
}
function claimTask(id){
  const task=state.tasks.find(t=>t.id===id);
  if(!task||task.completedDates.includes(activeDate))return;
  task.completedDates.push(activeDate);
  state.wallet+=task.cash;
  state.transactions.unshift({id:uniqueId('tx'),title:task.title,amount:task.cash,day:activeDate});
  state.transactions.length=Math.min(200,state.transactions.length);
  save();render();showToast(`+${amount(task.cash)}`);
}
function buyItem(id){
  const item=HERO_INDEX[id];
  if(!item||state.hero.owned.includes(id)||state.wallet<item.cost)return;
  if(!confirm(`Buy ${item.name} for ${amount(item.cost)}?`))return;
  if(!buyHeroItem(state,id))return;
  state.transactions.unshift({id:uniqueId('tx'),title:`Purchased: ${item.name}`,amount:-item.cost,day:activeDate});
  state.transactions.length=Math.min(200,state.transactions.length);
  save();render();showToast(`${item.name.toUpperCase()} EQUIPPED`);
}
function toggleEquip(id){
  if(!toggleHeroEquip(state.hero,id))return;
  save();render();showToast(state.hero.equipped[HERO_INDEX[id].type]===id?'EQUIPPED':'UNEQUIPPED');
}
function exportBackup(){
  const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const href=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=href;a.download=`lifestyle-hero-backup-${activeDate}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(href),2000);showToast('BACKUP READY');
}

document.addEventListener('click',event=>{
  const tab=event.target.closest('[data-tab]');
  if(tab&&tabs.includes(tab.dataset.tab)){activeTab=tab.dataset.tab;render();window.scrollTo({top:0,behavior:'auto'});return;}
  const modal=event.target.closest('[data-modal]');if(modal){openEditor();return;}
  const button=event.target.closest('[data-action]');if(!button)return;
  const {action,id,value}=button.dataset;
  switch(action){
    case 'log-stat':changeStat(id);break;
    case 'undo-stat':changeStat(id,true);break;
    case 'claim-task':claimTask(id);break;
    case 'buy-hero':buyItem(id);break;
    case 'toggle-equip':toggleEquip(id);break;
    case 'unequip':if(unequipHeroSlot(state.hero,id)){save();render();showToast('UNEQUIPPED');}break;
    case 'store-filter':storeFilter=value;render();break;
    case 'store-rarity':storeRarity=value;render();break;
    case 'set-theme':state.theme=value;save();render();break;
    case 'remove-task':if(confirm('Remove this task?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();}break;
    case 'close-modal':dialog.close();break;
    case 'export':exportBackup();break;
    case 'import':importFile.click();break;
    case 'reset':if(confirm('Reset hero stats, missions, funds and equipment? Your original home version is unaffected.')){state=initialState(activeDate);save();render();showToast('HERO RESET');}break;
  }
});
document.addEventListener('input',event=>{
  if(event.target.id!=='store-search')return;
  storeQuery=event.target.value;
  const list=document.getElementById('catalog-results');if(!list)return;
  list.innerHTML=catalogResults();
  list.querySelectorAll('canvas[data-item]').forEach(canvas=>drawItemIcon(canvas,HERO_INDEX[canvas.dataset.item]));
});

dialog.addEventListener('submit',event=>{
  event.preventDefault();const form=event.target;if(form.id!=='editor-form')return;
  const values=new FormData(form),title=String(values.get('title')||'').trim().slice(0,80),cash=Math.floor(Number(values.get('value')));
  if(!title||!Number.isInteger(cash)||cash<1||cash>10000)return;
  if(state.tasks.length>=150)return showToast('MAXIMUM TASKS REACHED');
  state.tasks.push({id:uniqueId('task'),title,cash,completedDates:[]});
  dialog.close();save();render();showToast('MISSION ADDED');
});
dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
importFile.addEventListener('change',async()=>{
  const file=importFile.files?.[0];if(!file)return;
  try{
    const raw=JSON.parse(await file.text());
    if(![1,2,3].includes(raw?.version)||!raw.stats?.health||!raw.stats?.stamina||!raw.stats?.focus)throw new Error('Invalid backup');
    if(!confirm('Replace this hero profile with your backup?'))return;
    state=hydrate(raw,activeDate);syncDay();save();render();showToast('BACKUP RESTORED');
  }catch{alert('Invalid Lifestyle Tracker backup. Your data was not changed.');}
  finally{importFile.value='';}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncDay();render();}});
setInterval(()=>{if(dateKey()!==activeDate){syncDay();render();}},60000);
syncDay();save();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

  </script>
